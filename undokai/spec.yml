# 運動会ダイジェスト編集 仕様（まおさん確定事項）
updated: 2026-10-03
status: 動画未受領（受領待ち）
length: 2:00〜3:00
obstacle_race:
  rule: 切らずに通しで見せる（途中カットしない）
  result: 1位
  cameras: 2台分（カメラ違い）→ 2アングルの扱いは未決（下記open）
target_child:
  identifier: ゼッケン表記で識別（氏名は公開リポジトリのため非記載。実名は非公開メモ側に保管）
bgm: なし（現場音のまま。まず一度見る→見て判断）
delivery: 未決（Drive推奨）
open:
  - 障害物競走の2アングル: 通し→別アングルのリプレイ、か、時間軸で切替か
  - 障害物競走以外の競技の有無・順序
  - 字幕/タイトルの有無

handoff:
  from: クラウドセッション（動画未受領・編集未着手）
  to: PC側セッション
  note: 動画はPCのローカルにある想定。PC側で直接読むのでアップロード不要
  next_steps:
    - 1. 動画の長さ・向き・音声を解析（ffprobe）
    - 2. 競技ごとの区切り＋対象の児が映る時間帯の一覧を作り、まおさんに確認
    - 3. 障害物競走の2アングルの扱い（案A/案B）を実映像を見て決める
    - 4. 2:00〜3:00で書き出し（BGMなし）→まおさんが視聴
  not_in_repo: 児の氏名（公開リポジトリのため）。PC側でまおさんに口頭で伝えてもらう
